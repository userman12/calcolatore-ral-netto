   Il file è diviso in tre sezioni nettamente separate:

============================================================================= */

/* =============================================================================
   (B) MOTORE DI CALCOLO — funzioni pure
   -----------------------------------------------------------------------------
   Convenzione: tutti gli importi sono in euro, in doppia precisione, SENZA
   arrotondamenti intermedi. L'arrotondamento è responsabilità della UI.
   (In un cedolino reale l'IRPEF si arrotonda all'unità di euro ad ogni periodo
   di paga: vedi TODO in fondo.)
============================================================================= */

/**
 * Applica una scala per scaglioni progressivi a un imponibile.
 * Restituisce il totale e il dettaglio scaglione per scaglione.
 */
function applicaScaglioni(imponibile, scaglioni) {
  let residuo = Math.max(0, imponibile);
  let precedente = 0;
  let totale = 0;
  const dettaglio = [];

  for (const s of scaglioni) {
    if (residuo <= 0) break;
    const ampiezza = s.fino - precedente;
    const quota = Math.min(residuo, ampiezza);
    const imposta = quota * s.aliquota;
    dettaglio.push({
      da: precedente,
      a: s.fino,
      aliquota: s.aliquota,
      imponibileNelloScaglione: quota,
      imposta,
    });
    totale += imposta;
    residuo -= quota;
    precedente = s.fino;
  }
  return { totale, dettaglio };
}

/**
 * Contributi previdenziali a carico del dipendente.
 * Base = RAL, limitata al massimale annuo.
 * Aliquota base + 1% sulla quota eccedente la prima fascia pensionabile.
 */
function calcolaContributiDipendente(ral, cfg) {
  const c = cfg.inps;

  // TODO: l'imponibile previdenziale è assunto pari alla RAL. In un cedolino reale
  // differisce dall'imponibile fiscale: vanno escluse alcune indennità e inclusi i
  // fringe benefit oltre soglia. Per farlo bene servirebbe la scomposizione della
  // retribuzione per voce, con il flag di imponibilità previdenziale di ciascuna.

  // TODO: il massimale è applicato a chiunque, ma per legge riguarda i soli iscritti
  // privi di anzianità contributiva al 31/12/1995. Per farlo bene serve la data di
  // prima iscrizione del lavoratore come input.
  const baseContributiva = Math.min(ral, c.massimaleAnnuo);

  const quotaBase = baseContributiva * c.aliquotaDipendente;

  const eccedenzaPrimaFascia = Math.max(0, baseContributiva - c.primaFasciaPensionabile);
  const quotaAggiuntiva = eccedenzaPrimaFascia * c.aliquotaAggiuntiva;

  return {
    baseContributiva,
    quotaBase,
    eccedenzaPrimaFascia,
    quotaAggiuntiva,
    totale: quotaBase + quotaAggiuntiva,
    massimaleApplicato: ral > c.massimaleAnnuo,
  };
}

/**
 * Contributi a carico del datore + accantonamento TFR → costo azienda.
 */
function calcolaCostoAzienda(ral, cfg) {
  const c = cfg.inps;
  const baseContributiva = Math.min(ral, c.massimaleAnnuo);

  const contributiInpsDatore = baseContributiva * c.aliquotaDatore;
  const premioInail = ral * c.aliquotaInail;

  // TODO: manca la rivalutazione annua del TFR già accantonato (1,5% + 75%
  // dell'indice ISTAT) e la relativa imposta sostitutiva del 17%. Per farlo bene
  // servirebbe lo stock di TFR pregresso e la serie storica dell'indice ISTAT:
  // qui si calcola la sola quota di competenza dell'anno.
  const quotaTfrLorda = ral / cfg.tfr.divisore;
  const contributoFondoGaranzia = ral * cfg.tfr.contributoFondoGaranzia;
  const accantonamentoTfr = quotaTfrLorda - contributoFondoGaranzia;

  const contributiDatore = contributiInpsDatore + premioInail;

  return {
    contributiInpsDatore,
    premioInail,
    contributiDatore,
    quotaTfrLorda,
    contributoFondoGaranzia,
    accantonamentoTfr,
    costoTotale: ral + contributiDatore + accantonamentoTfr,
  };
}

/**
 * Detrazione per redditi di lavoro dipendente (art. 13 TUIR) + maggiorazione 65 €.
 * `giorniLavorati` è tenuto come parametro esplicito: nel caso base è 365.
 */
function calcolaDetrazioneLavoro(redditoComplessivo, cfg, giorniLavorati = 365) {
  const d = cfg.detrazioneLavoroDipendente;
  const fascia = d.fasce.find((f) => redditoComplessivo <= f.fino);

  const teorica = Math.max(0, fascia.formula(redditoComplessivo));
  // Ragguaglio ai giorni di lavoro nell'anno (nel caso base = 1).
  const ragguagliata = teorica * (giorniLavorati / 365);

  const m = d.maggiorazione;
  const spettaMaggiorazione =
    redditoComplessivo > m.da && redditoComplessivo <= m.a;
  const maggiorazione = spettaMaggiorazione ? m.importo : 0;

  return {
    fascia,
    teorica,
    ragguagliata,
    maggiorazione,
    totale: ragguagliata + maggiorazione,
  };
}

/**
 * Ulteriore detrazione "cuneo fiscale" per redditi 20.000 – 40.000 €.
 */
function calcolaUlterioreDetrazione(redditoComplessivo, cfg) {
  const fascia = cfg.ulterioreDetrazione.fasce.find(
    (f) => redditoComplessivo > f.da && redditoComplessivo <= f.a
  );
  if (!fascia) return { spetta: false, importo: 0, fascia: null };
  return {
    spetta: true,
    importo: Math.max(0, fascia.formula(redditoComplessivo)),
    fascia,
  };
}

/**
 * Somma integrativa non imponibile per redditi fino a 20.000 €.
 * Non riduce l'imposta: si somma direttamente al netto.
 */
function calcolaSommaIntegrativa(redditoComplessivo, redditoLavoroDipendente, cfg) {
  const s = cfg.sommaIntegrativa;
  if (redditoComplessivo > s.sogliaRedditoComplessivo) {
    return { spetta: false, importo: 0, percentuale: 0 };
  }
  const fascia = s.fasce.find((f) => redditoLavoroDipendente <= f.fino);
  if (!fascia) return { spetta: false, importo: 0, percentuale: 0 };
  return {
    spetta: true,
    percentuale: fascia.percentuale,
    importo: redditoLavoroDipendente * fascia.percentuale,
    fascia,
  };
}

/**
 * Trattamento integrativo (ex bonus Renzi), con test di capienza.
 *
 * SEMPLIFICAZIONE: nella fascia 15.000–28.000 la norma confronta l'imposta lorda
 * con la SOMMA di più detrazioni (art. 12, 13, 15 per oneri specifici, rate di
 * detrazione per ristrutturazioni...). Qui consideriamo la sola detrazione da
 * lavoro dipendente, coerentemente con il caso base "nessun carico familiare,
 * nessun onere detraibile".
 */
function calcolaTrattamentoIntegrativo(redditoComplessivo, impostaLorda, detrazioneLavoro, cfg) {
  const t = cfg.trattamentoIntegrativo;

  if (redditoComplessivo > t.sogliaMassima) {
    return { spetta: false, importo: 0, motivo: `Reddito complessivo oltre ${t.sogliaMassima} €` };
  }

  if (redditoComplessivo <= t.sogliaPiena) {
    // Spetta l'importo pieno solo se c'è capienza: imposta lorda > detrazione − 75 €.
    const sogliaCapienza = detrazioneLavoro - t.abbattimentoCapienza;
    if (impostaLorda > sogliaCapienza) {
      return {
        spetta: true,
        importo: t.importoMassimo,
        motivo: `Imposta lorda (${impostaLorda.toFixed(2)}) > detrazione − 75 € (${sogliaCapienza.toFixed(2)})`,
      };
    }
    return {
      spetta: false,
      importo: 0,
      motivo: `Incapienza: imposta lorda (${impostaLorda.toFixed(2)}) ≤ detrazione − 75 € (${sogliaCapienza.toFixed(2)})`,
    };
  }

  // Fascia 15.000 – 28.000: spetta la differenza tra detrazioni e imposta lorda,
  // nel limite di 1.200 €.
  const differenza = detrazioneLavoro - impostaLorda;
  if (differenza > 0) {
    return {
      spetta: true,
      importo: Math.min(t.importoMassimo, differenza),
      motivo: `Detrazioni (${detrazioneLavoro.toFixed(2)}) > imposta lorda (${impostaLorda.toFixed(2)})`,
    };
  }
  return {
    spetta: false,
    importo: 0,
    motivo: `Detrazioni (${detrazioneLavoro.toFixed(2)}) ≤ imposta lorda (${impostaLorda.toFixed(2)})`,
  };
}

/**
 * Addizionale comunale: la soglia di esenzione di Milano opera come cliff,
 * non come franchigia.
 */
function calcolaAddizionaleComunale(imponibile, cfg) {
  const a = cfg.addizionaleComunale;
  if (imponibile <= a.sogliaEsenzione) {
    return { importo: 0, esente: true, baseApplicata: 0 };
  }
  const base = a.esenzioneCliff ? imponibile : imponibile - a.sogliaEsenzione;
  return { importo: base * a.aliquota, esente: false, baseApplicata: base };
}

/**
 * FUNZIONE PRINCIPALE.
 * Input: RAL, numero mensilità, configurazione dell'anno.
 * Output: breakdown completo con ogni voce intermedia.
 */
function calcolaNetto({ ral, mensilita = 13, config, giorniLavorati = 365 }) {
  const cfg = config;

  // --- 1. Costo azienda ------------------------------------------------------
  const costoAzienda = calcolaCostoAzienda(ral, cfg);

  // --- 2/3. Contributi c/dipendente -----------------------------------------
  const contributi = calcolaContributiDipendente(ral, cfg);

  // --- 4. Imponibile fiscale -------------------------------------------------
  // I contributi obbligatori sono oneri deducibili (art. 10 TUIR); per il
  // dipendente operano già in busta paga abbattendo l'imponibile.
  // TODO: l'imponibile fiscale ignora fringe benefit oltre soglia, welfare aziendale,
  // premi di risultato a tassazione sostitutiva e contributi a previdenza complementare
  // (deducibili entro plafond). Per farlo bene serve la scomposizione della retribuzione
  // per voce con il regime fiscale di ciascuna.
  const imponibileFiscale = ral - contributi.totale;

  // Nel caso base (unica fonte di reddito) reddito complessivo = imponibile.
  // TODO: il reddito complessivo che governa detrazioni, bonus e soglie dovrebbe
  // includere gli altri redditi del contribuente (altri rapporti di lavoro, redditi
  // di capitale, rendita catastale dell'abitazione principale con la relativa
  // deduzione). Con un solo datore di lavoro il sostituto d'imposta non li conosce:
  // per farlo bene serve un input dichiarativo del lavoratore.
  const redditoComplessivo = imponibileFiscale;
  const redditoLavoroDipendente = imponibileFiscale;

  // --- 5. IRPEF lorda --------------------------------------------------------
  const irpefLorda = applicaScaglioni(imponibileFiscale, cfg.irpef.scaglioni);

  // --- 6. Detrazioni da lavoro dipendente ------------------------------------
  const detrazioneLavoro = calcolaDetrazioneLavoro(redditoComplessivo, cfg, giorniLavorati);

  // --- 7a. Ulteriore detrazione (cuneo) --------------------------------------
  const ulteriore = calcolaUlterioreDetrazione(redditoComplessivo, cfg);

  // TODO: mancano le detrazioni per carichi di famiglia (art. 12 TUIR) e per oneri
  // (art. 15). Per farle bene servono composizione del nucleo familiare, redditi dei
  // familiari e oneri documentati: sono l'estensione più richiesta e la prima da
  // aggiungere dopo il caso base.

  // Le detrazioni non possono generare credito: sono limitate alla capienza.
  const detrazioniTotaliTeoriche = detrazioneLavoro.totale + ulteriore.importo;
  const detrazioniUtilizzate = Math.min(irpefLorda.totale, detrazioniTotaliTeoriche);
  const detrazioniPerse = detrazioniTotaliTeoriche - detrazioniUtilizzate;

  const irpefNetta = Math.max(0, irpefLorda.totale - detrazioniTotaliTeoriche);

  // --- 7b. Trattamento integrativo ------------------------------------------
  const trattamentoIntegrativo = calcolaTrattamentoIntegrativo(
    redditoComplessivo,
    irpefLorda.totale,
    detrazioneLavoro.totale,
    cfg
  );

  // --- 7c. Somma integrativa (redditi fino a 20.000) -------------------------
  const sommaIntegrativa = calcolaSommaIntegrativa(
    redditoComplessivo,
    redditoLavoroDipendente,
    cfg
  );

  // --- 8. Addizionali --------------------------------------------------------
  // Le addizionali sono dovute solo se per lo stesso anno risulta dovuta l'IRPEF.
  // TODO: qui sono imputate per competenza. In busta paga il saldo dell'anno N si
  // trattiene in 11 rate nell'anno N+1 e l'addizionale comunale prevede un acconto
  // del 30% sull'anno in corso. Per farlo bene serve un modello di cassa mese per
  // mese, che è anche l'unico modo per riprodurre il netto di una singola busta paga.
  const addizionaliDovute = irpefNetta > 0;

  const addRegionaleCalc = applicaScaglioni(imponibileFiscale, cfg.addizionaleRegionale.scaglioni);
  const addRegionale = addizionaliDovute ? addRegionaleCalc.totale : 0;

  const addComunaleCalc = calcolaAddizionaleComunale(imponibileFiscale, cfg);
  const addComunale = addizionaliDovute ? addComunaleCalc.importo : 0;

  // --- 9. Netto --------------------------------------------------------------
  const totaleImposte = irpefNetta + addRegionale + addComunale;
  const totaleTrattenute = contributi.totale + totaleImposte;
  const bonusNetti = trattamentoIntegrativo.importo + sommaIntegrativa.importo;

  const nettoAnnuo = ral - totaleTrattenute + bonusNetti;

  // TODO: il netto mensile è la media annua. Il cedolino reale varia di mese in mese
  // (13ª e 14ª non scontano le detrazioni allo stesso modo, le addizionali si
  // trattengono in rate, il conguaglio di dicembre riallinea tutto). Per farlo bene
  // serve il calcolo per periodo di paga con arrotondamento all'unità di euro e
  // conguaglio finale.
  const nettoMensile = nettoAnnuo / mensilita;

  const aliquotaMediaEffettiva = ral > 0 ? (totaleTrattenute - bonusNetti) / ral : 0;
  const cuneoFiscale =
    costoAzienda.costoTotale > 0
      ? (costoAzienda.costoTotale - nettoAnnuo) / costoAzienda.costoTotale

  // --- Breakdown per la UI: catena dall'alto verso il basso -------------------

/**
 * Intervallo di RAL entro cui il modello è attendibile.
 *
 * Non sono limiti estetici: sono i due punti oltre i quali entrano in gioco
 * regole che il motore non implementa, e quindi oltre i quali il risultato
 * sarebbe sbagliato in una direzione nota.
 */
function limitiRal(cfg) {
  const minima = cfg.inps.minimaleGiornaliero * cfg.inps.giorniConvenzionaliAnno;
  const massima = ralDaImponibile(cfg.irpef.sogliaNeutralizzazioneBeneficio, cfg);

  return {
    minima,
    massima,
    motivoMinimo:
      `Sotto ${fmt(minima)} i contributi non si calcolano più sulla retribuzione effettiva ` +
      `ma sul minimale di ${fmt(cfg.inps.minimaleGiornaliero)} al giorno per ` +
      `${cfg.inps.giorniConvenzionaliAnno} giorni. Il modello non lo implementa e ` +
      `sottostimerebbe i contributi.`,
    motivoMassimo:
      `Oltre ${fmt(massima)} il reddito complessivo supera ` +
      `${fmt(cfg.irpef.sogliaNeutralizzazioneBeneficio)} e scatta la neutralizzazione del ` +
      `taglio IRPEF prevista dalla L. 199/2025, che il modello non implementa. Il netto ` +
      `risulterebbe sovrastimato.`,
    fonteMinimo: cfg.inps.fonteMinimale,
    fonteMassimo: cfg.irpef.fonte,
  };
}

/** Gli stessi limiti, espressi in netto mensile per la modalità inversa. */
function limitiNettoMensile(cfg, mensilita) {
  const l = limitiRal(cfg);
  return {
    ...l,
    minima: calcolaNetto({ ral: l.minima, mensilita, config: cfg }).nettoMensile,
    massima: calcolaNetto({ ral: l.massima, mensilita, config: cfg }).nettoMensile,
  };
}

/**
 * MODALITÀ INVERSA — dal netto mensile desiderato alla RAL.
 * Ricerca binaria sulla funzione diretta, che è monotona crescente a tratti
 * (i cliff normativi la rendono non continua: in quei punti la ricerca converge
 * al valore più basso che raggiunge o supera il target).
 */
function ralDaNettoMensile({ nettoMensileTarget, mensilita, config, tolleranza = 0.01, maxIter = 100 }) {
  let lo = 0;
  let hi = 1000000;

  const nettoDi = (ral) => calcolaNetto({ ral, mensilita, config }).nettoMensile;

  if (nettoDi(hi) < nettoMensileTarget) {
    return { trovata: false, ral: null, iterazioni: 0 };
  }

  let iter = 0;
  while (hi - lo > tolleranza && iter < maxIter) {
    const mid = (lo + hi) / 2;
    if (nettoDi(mid) < nettoMensileTarget) lo = mid;
    else hi = mid;
    iter++;
  }

  const ral = hi;
  return { trovata: true, ral, iterazioni: iter, risultato: calcolaNetto({ ral, mensilita, config }) };
}

/**
 * Aliquota marginale effettiva: quanto dell'euro lordo aggiuntivo NON arriva al
 * lavoratore. Calcolata numericamente per catturare anche i salti da décalage
 * delle detrazioni e i cliff (20.000 e 23.000).
 */
function aliquotaMarginale(ral, config, delta = 100) {
  const a = calcolaNetto({ ral: Math.max(0, ral - delta / 2), mensilita: 12, config }).nettoAnnuo;
  const b = calcolaNetto({ ral: ral + delta / 2, mensilita: 12, config }).nettoAnnuo;
  return 1 - (b - a) / delta;
}

function curvaAliquotaMarginale(config, { da = 0, a = 100000, passo = 250 } = {}) {
  const punti = [];
  for (let ral = da; ral <= a; ral += passo) {
    punti.push({ ral, marginale: aliquotaMarginale(ral, config, passo) });
  }
  return punti;
}

/**
 * Converte una soglia espressa in imponibile fiscale nella RAL corrispondente.
 * Sotto la prima fascia pensionabile il rapporto è lineare, quindi l'inversione
 * è esatta; sopra, il contributo aggiuntivo dell'1% la rende un'approssimazione.
 */
function ralDaImponibile(imponibile, config) {
  const c = config.inps;

  // La curva dei contributi ha tre tratti, e l'inversione deve seguirli tutti:
  // sotto la prima fascia solo l'aliquota base, in mezzo anche l'1% aggiuntivo,
  // sopra il massimale i contributi si fermano e il rapporto torna lineare.
  const contributiAlMassimale =
    c.massimaleAnnuo * c.aliquotaDipendente +
    (c.massimaleAnnuo - c.primaFasciaPensionabile) * c.aliquotaAggiuntiva;

  const imponibileAllaPrimaFascia = c.primaFasciaPensionabile * (1 - c.aliquotaDipendente);
  const imponibileAlMassimale = c.massimaleAnnuo - contributiAlMassimale;

  if (imponibile <= imponibileAllaPrimaFascia) {
    return imponibile / (1 - c.aliquotaDipendente);
  }
  if (imponibile <= imponibileAlMassimale) {
    return (imponibile - c.primaFasciaPensionabile * c.aliquotaAggiuntiva) /
           (1 - c.aliquotaDipendente - c.aliquotaAggiuntiva);
  }
  return imponibile + contributiAlMassimale;
}

/**
 * Soglie normative rilevanti, derivate dalla config e riportate in RAL.
 * Nessun valore hardcoded: se cambia la config, cambiano le soglie.
 */
function soglieNotevoli(config) {
  const s = [];
  const add = (imponibile, etichetta) =>
    s.push({ imponibile, ral: ralDaImponibile(imponibile, config), etichetta });

  config.sommaIntegrativa.fasce.forEach((f, i) => {
    if (i < config.sommaIntegrativa.fasce.length - 1)
      add(f.fino, `somma integrativa ${pct(f.percentuale)} → ${pct(config.sommaIntegrativa.fasce[i + 1].percentuale)}`);
  });
  add(config.sommaIntegrativa.sogliaRedditoComplessivo, "fine somma integrativa, inizio ulteriore detrazione");
  add(config.addizionaleComunale.sogliaEsenzione, `soglia esenzione addizionale comunale ${config.addizionaleComunale.comune}`);
  config.irpef.scaglioni.slice(0, -1).forEach((sc, i) =>
    add(sc.fino, `scaglione IRPEF ${pct(sc.aliquota)} → ${pct(config.irpef.scaglioni[i + 1].aliquota)}`));
  add(config.detrazioneLavoroDipendente.maggiorazione.a, "fine maggiorazione 65 € art. 13 c. 1.1");
  add(config.ulterioreDetrazione.fasce[config.ulterioreDetrazione.fasce.length - 1].a, "fine ulteriore detrazione");
  add(config.inps.primaFasciaPensionabile, "inizio contributo aggiuntivo 1%");

  return s.sort((a, b) => a.ral - b.ral);
}

/**
 * Individua numericamente i punti in cui il netto DIMINUISCE al crescere della RAL.
 * Sono i cliff normativi: informazione di prodotto rilevante, perché in quei punti
 * un aumento di stipendio lordo peggiora la busta paga.
 */
function trovaCliff(config, { da = 0, a = 100000, passo = 50 } = {}) {
  const cliff = [];
  let prec = calcolaNetto({ ral: da, mensilita: 12, config }).nettoAnnuo;
  for (let ral = da + passo; ral <= a; ral += passo) {
    const n = calcolaNetto({ ral, mensilita: 12, config }).nettoAnnuo;
    if (n < prec - 0.01) cliff.push({ ral, perdita: n - prec });
    prec = n;
  }
  return cliff;
}

// --- Utility di formattazione (usate anche dal motore per comporre le stringhe
// --- delle formule; sono pure e senza dipendenze dal DOM).
function fmt(n) {
  if (n === Infinity) return "∞";
  return new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR", maximumFractionDigits: 2 }).format(n);
}
function fmt0(n) {
  return new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(n);
}
function pct(n, decimali = 2) {
  return `${(n * 100).toFixed(decimali).replace(".", ",")}%`;
}

/**
 * Campo numerico controllato che conserva il TESTO digitato, non il numero.
 *
 * Coercere a numero a ogni battuta rende il campo impossibile da svuotare: la
 * stringa vuota diventa 0, il campo si ripopola da solo e le cifre digitate
 * dopo finiscono in coda allo zero rimasto. Tenendo il testo, lo stato vuoto è
 * uno stato legittimo durante la digitazione e viene letto come 0 solo dal
 * motore di calcolo.
 */
/**
 * Riduce il testo digitato a un numero reale positivo.
 *
 * I campi sono type="text" e non type="number" di proposito: un input numerico
 * accetta la notazione scientifica ("1e5"), il segno e il "+", e soprattutto
 * quando il contenuto è invalido espone value="" pur continuando a mostrare a
 * schermo quello che l'utente ha scritto. Testo visibile e stato divergono, e
 * il campo diventa incontrollabile. Sanificando qui, ciò che si vede è sempre
 * ciò che c'è nello stato.
 */
function normalizzaInputNumerico(grezzo) {
  // Solo euro interi: le retribuzioni si comunicano in euro pieni, in offerta
  // come nelle tabelle CCNL, e i centesimi non cambierebbero nulla di leggibile
  // nel risultato. Ammettere i decimali qui costringerebbe a distinguere il
  // separatore decimale da quello delle migliaia mentre l'utente digita, un
  // problema che senza decimali semplicemente non esiste: punti e virgole sono
  // inequivocabilmente separatori di migliaia e si possono scartare.
  //
  // Cadono quindi lettere (compresa la "e" dell'esponente), segni, spazi,
  // simboli di valuta e separatori: resta solo una sequenza di cifre.
  const soloCifre = String(grezzo).replace(/\D/g, "");

  // Niente zeri iniziali incollati davanti alle cifre; lo "0" isolato resta.
  return soloCifre.replace(/^0+(?=\d)/, "");
}

function valoreNumerico(testo) {
  // La stringa vuota è uno stato legittimo del campo durante la digitazione:
  // vale 0 per il motore, ma non deve mai riscrivere il contenuto del campo.
  const n = Number(testo);
  return Number.isFinite(n) && n > 0 ? n : 0;
}

/**
 * Incremento e decremento con la stessa semantica di un input type="number":
 * il valore si aggancia al multiplo del passo, non ci si limita a sommare.
 * Da 35.123 con passo 500 si sale a 35.500 e si scende a 35.000, non a 35.623
 * e 34.623.
 */
function passoSu(valore, passo) {
  return (Math.floor(valore / passo) + 1) * passo;
}

function passoGiu(valore, passo) {
  return Math.max(0, (Math.ceil(valore / passo) - 1) * passo);
}

function useCampoNumerico(valoreIniziale) {
  const [testo, setTesto] = useState(String(valoreIniziale));
  const aggiorna = (grezzo) => setTesto(normalizzaInputNumerico(grezzo));
  return [testo, valoreNumerico(testo), aggiorna];
}

function Card({ title, children, className = "" }) {

/** Cella di un controllo: etichetta e comando hanno sempre la stessa struttura,
 *  così la riga risulta allineata per costruzione e non per aggiustamenti. */
function Campo({ label, children }) {
  return (
    <div className="flex flex-col">
      <span className="text-xs font-semibold text-slate-600 mb-1 h-4 leading-4 whitespace-nowrap">{label}</span>
      {children}
    </div>
  );
}

/** Campo importo con incremento e decremento, come le frecce di un input
 *  numerico ma senza ereditarne i difetti (notazione scientifica, segno). */
function CampoImporto({ label, testo, valore, onTesto, passo, min, max }) {
  // Le frecce non escono mai dall'intervallo supportato; la digitazione sì,
  // perché bloccare i tasti rende il campo impossibile da correggere. Fuori
  // intervallo il risultato resta visibile ma accompagnato dall'avviso.
  const vaiA = (n) => onTesto(String(Math.min(max, Math.max(min, n))));

  const daTastiera = (e) => {
    if (e.key === "ArrowUp") { e.preventDefault(); vaiA(passoSu(valore, passo)); }
    if (e.key === "ArrowDown") { e.preventDefault(); vaiA(passoGiu(valore, passo)); }
  };

  return (
    <Campo label={label}>
      <div className="flex h-10 rounded-md border border-slate-300 bg-white overflow-hidden focus-within:ring-2 focus-within:ring-slate-400">
        <button
          type="button" onClick={() => vaiA(passoGiu(valore, passo))}
          aria-label={`Diminuisci di ${passo}`} title={`− ${passo}`}
          className="w-9 shrink-0 text-slate-500 hover:bg-slate-100 hover:text-slate-900"
        >
          −
        </button>
        <input
          type="text" inputMode="numeric" autoComplete="off" value={testo}
          onChange={(e) => onTesto(e.target.value)} onKeyDown={daTastiera}
          aria-label={label}
          className="w-28 text-center text-sm tabular-nums bg-transparent outline-none"
        />
        <button
          type="button" onClick={() => vaiA(passoSu(valore, passo))}
          aria-label={`Aumenta di ${passo}`} title={`+ ${passo}`}
          className="w-9 shrink-0 text-slate-500 hover:bg-slate-100 hover:text-slate-900"
        >
          +
        </button>
      </div>
      <span className="text-[11px] text-slate-500 mt-1 tabular-nums">
        da {fmt0(min)} a {fmt0(max)}
      </span>
    </Campo>
  );
}

function KPI({ label, value, sub, accent }) {
  return (
    <div className={`rounded-lg p-4 ${accent ? "bg-slate-900 text-white" : "bg-white border border-slate-200"}`}>
      <div className={`text-xs uppercase tracking-wide ${accent ? "text-slate-300" : "text-slate-500"}`}>{label}</div>
      <div className="text-2xl font-bold mt-1 tabular-nums">{value}</div>
      {sub && <div className={`text-xs mt-1 ${accent ? "text-slate-400" : "text-slate-500"}`}>{sub}</div>}
    </div>
  );
}

function Waterfall({ result, mostraCostoAzienda, selected, onSelect }) {
  const steps = result.steps.filter((s) => mostraCostoAzienda || !s.soloCostoAzienda);
  const max = Math.max(...steps.map((s) => s.importo));

  const colore = (s) => {
    if (s.tipo === "totale") return "bg-slate-700";
    if (s.tipo === "sottrazione") return "bg-rose-400";
    return "bg-emerald-400";
  };
  const segno = (s) => (s.tipo === "totale" ? "=" : s.tipo === "sottrazione" ? "−" : "+");

  return (
    <div className="space-y-1">
      {steps.map((s) => {
        const attivo = selected === s.id;
        const larghezza = max > 0 ? Math.max(0.5, (s.importo / max) * 100) : 0;
        return (
          <div key={s.id}>
            <button
              onClick={() => onSelect(attivo ? null : s.id)}
              className={`w-full text-left px-3 py-2 rounded transition ${attivo ? "bg-slate-100 ring-1 ring-slate-300" : "hover:bg-slate-50"}`}
            >
              <div className="flex items-baseline justify-between gap-4">
                <span className={`text-sm ${s.tipo === "totale" ? "font-semibold" : ""}`}>
                  <span className="inline-block w-4 text-slate-400">{segno(s)}</span>
                  {s.label}
                  {s.warning && (
                    <span className="ml-1 text-amber-600 text-xs" title="Aliquota che varia per CCNL e classificazione aziendale: valore da verificare">⚠</span>
                  )}
                </span>
                <span className={`text-sm tabular-nums whitespace-nowrap ${s.tipo === "totale" ? "font-semibold" : "text-slate-600"}`}>
                  {fmt(s.importo)}
                </span>
              </div>
              <div className="mt-1 h-1.5 bg-slate-100 rounded overflow-hidden">
                <div className={`h-full ${colore(s)}`} style={{ width: `${larghezza}%` }} />
              </div>
            </button>

            {attivo && (
              <div className="mx-3 mb-2 p-3 bg-slate-50 border border-slate-200 rounded text-xs space-y-2">
                <div>
                  <div className="text-slate-500 uppercase tracking-wide text-[10px] font-semibold">Importo</div>
                  <div className="tabular-nums">{fmt(s.importo)}</div>
                </div>
                <div>
                  <div className="text-slate-500 uppercase tracking-wide text-[10px] font-semibold">Base di calcolo</div>
                  <div>{s.base}</div>
                </div>
                <div>
                  <div className="text-slate-500 uppercase tracking-wide text-[10px] font-semibold">Formula applicata</div>
                  <pre className="whitespace-pre-wrap font-mono text-[11px] leading-relaxed">{s.formula}</pre>
                </div>
                <div>
                  <div className="text-slate-500 uppercase tracking-wide text-[10px] font-semibold">Riferimento</div>
                  <div className="text-slate-600">{s.riferimento}</div>
                </div>
                {s.nota && (
                  <div className="pt-1 border-t border-slate-200 text-slate-600 italic">{s.nota}</div>
                )}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function GraficoMarginale({ config }) {
  const MAX_RAL = 100000;
  const PASSO = 100;

  const { punti, soglie, cliff } = useMemo(() => ({
    punti: curvaAliquotaMarginale(config, { da: 0, a: MAX_RAL, passo: PASSO }),
    soglie: soglieNotevoli(config).filter((s) => s.ral <= MAX_RAL),
    cliff: trovaCliff(config, { da: 0, a: MAX_RAL, passo: 50 }),
  }), [config]);

  const W = 720, H = 280, ML = 46, MB = 26, MT = 12, MR = 12;
  const maxY = Math.max(1.2, ...punti.map((p) => p.marginale));
  const x = (ral) => ML + (ral / MAX_RAL) * (W - ML - MR);
  const y = (v) => MT + (1 - v / maxY) * (H - MT - MB);

  const path = punti
    .map((p, i) => `${i === 0 ? "M" : "L"}${x(p.ral).toFixed(1)},${y(p.marginale).toFixed(1)}`)
    .join(" ");

  const ticks = [0, 0.25, 0.5, 0.75, 1.0].filter((t) => t <= maxY);

  return (
    <div>
      <div className="overflow-x-auto">
        <svg viewBox={`0 0 ${W} ${H}`} className="w-full min-w-[620px]">
          {/* banda sopra il 100%: zona in cui il lordo aggiuntivo riduce il netto */}
          <rect x={ML} y={y(maxY)} width={W - ML - MR} height={Math.max(0, y(1) - y(maxY))} fill="#fee2e2" />
          {ticks.map((t) => (
            <g key={t}>
              <line x1={ML} x2={W - MR} y1={y(t)} y2={y(t)} stroke="#e2e8f0" strokeWidth="1" />
              <text x={ML - 6} y={y(t) + 3} textAnchor="end" fontSize="9" fill="#64748b">{(t * 100).toFixed(0)}%</text>
            </g>
          ))}
          <line x1={ML} x2={W - MR} y1={y(1)} y2={y(1)} stroke="#f87171" strokeWidth="1" strokeDasharray="4 3" />
          {soglie.map((s, i) => (
            <line key={i} x1={x(s.ral)} x2={x(s.ral)} y1={MT} y2={H - MB} stroke="#cbd5e1" strokeWidth="1" strokeDasharray="3 3" />
          ))}
          {[0, 20000, 40000, 60000, 80000, 100000].map((v) => (
            <text key={v} x={x(v)} y={H - MB + 14} textAnchor="middle" fontSize="9" fill="#64748b">{v / 1000}k</text>
          ))}
          <path d={path} fill="none" stroke="#0f172a" strokeWidth="1.6" />
        </svg>
      </div>

      <p className="mt-2 text-xs text-slate-600">
        Aliquota marginale effettiva: quota dell'euro lordo aggiuntivo che <em>non</em> arriva al lavoratore
        (contributi + IRPEF + addizionali, comprese le perdite di bonus e detrazioni per décalage).
        Le linee tratteggiate verticali sono le soglie normative, calcolate dalla config e convertite in RAL.
      </p>

      <div className="mt-3 grid sm:grid-cols-2 gap-4">
        <div>
          <div className="text-[10px] uppercase tracking-wide font-semibold text-slate-500 mb-1">Soglie normative</div>
          <ul className="text-xs space-y-0.5 text-slate-600">
            {soglie.map((s, i) => (
              <li key={i} className="tabular-nums">
                <span className="font-semibold">{fmt0(s.ral)}</span> di RAL
                <span className="text-slate-400"> (imponibile {fmt0(s.imponibile)})</span> — {s.etichetta}
              </li>
            ))}
          </ul>
        </div>
        <div>
          <div className="text-[10px] uppercase tracking-wide font-semibold text-rose-600 mb-1">
            Cliff — dove aumentare la RAL riduce il netto
          </div>
          {cliff.length === 0 ? (
            <p className="text-xs text-slate-500">Nessun cliff rilevato in questo intervallo.</p>
          ) : (
            <ul className="text-xs space-y-0.5 text-slate-600 tabular-nums">
              {cliff.map((c, i) => (
                <li key={i}>
                  intorno a <span className="font-semibold">{fmt0(c.ral)}</span> di RAL: il netto annuo perde{" "}
                  <span className="text-rose-600 font-semibold">{fmt(Math.abs(c.perdita))}</span>
                </li>
              ))}
            </ul>
          )}
          <p className="text-xs text-slate-500 mt-2">
            Rilevati numericamente scandendo la funzione diretta a passi di 50 € di RAL: sono i punti in cui
            una soglia opera come cliff anziché come décalage graduale. È l'informazione più utile per chi
            negozia un aumento.
          </p>
        </div>
      </div>
    </div>
  );
}

        aliquote datore); scostamenti superiori indicano un errore di modello.

function App() {
  const [ralTesto, ral, setRalTesto] = useCampoNumerico(35000);
  const [mensilita, setMensilita] = useState(13);
  const [selected, setSelected] = useState(null);
  const [modalitaInversa, setModalitaInversa] = useState(false);
  const [mostraCostoAzienda, setMostraCostoAzienda] = useState(true);
  const [nettoTargetTesto, nettoTarget, setNettoTargetTesto] = useCampoNumerico(2000);

  const config = TAX_CONFIG[ANNO_CORRENTE];

  // I limiti non sono scelte di interfaccia: fuori da questo intervallo il
  // modello omette regole che cambierebbero il risultato. Si arrotondano
  // all'euro perché i campi accettano solo interi.
  const limiti = useMemo(() => {
    const r = limitiRal(config);
    const n = limitiNettoMensile(config, mensilita);
    return {
      ral: { ...r, min: Math.ceil(r.minima), max: Math.floor(r.massima) },
      netto: { ...n, min: Math.ceil(n.minima), max: Math.floor(n.massima) },
    };
  }, [mensilita]);

  const attivo = modalitaInversa
    ? { valore: nettoTarget, ...limiti.netto }
    : { valore: ral, ...limiti.ral };
  const sottoIlMinimo = attivo.valore > 0 && attivo.valore < attivo.min;
  const sopraIlMassimo = attivo.valore > attivo.max;

  const inversa = useMemo(() => {
    if (!modalitaInversa) return null;
    return ralDaNettoMensile({ nettoMensileTarget: nettoTarget, mensilita, config });
  }, [modalitaInversa, nettoTarget, mensilita]);

  const ralEffettiva = modalitaInversa && inversa && inversa.trovata ? inversa.ral : ral;
  const result = useMemo(
    () => calcolaNetto({ ral: ralEffettiva, mensilita, config }),
    [ralEffettiva, mensilita]
  );

  return (
    <div className="max-w-6xl mx-auto p-4 sm:p-6 space-y-6">
      <header className="space-y-1">
        <h1 className="text-2xl font-bold">Calcolatore RAL → Netto</h1>
        <p className="text-sm text-slate-600">
          Prototipo — impiegato a tempo indeterminato, Milano (Lombardia), nessuna agevolazione, anno {config.etichetta}.
        </p>
      </header>

      {/* INPUT */}
      <Card>
        <div className="flex flex-wrap gap-4">
          <Campo label="Modalità">
            <div className="flex h-10 rounded-md border border-slate-300 overflow-hidden text-sm">
              <button
                type="button" onClick={() => setModalitaInversa(false)}
                className={`px-3 ${!modalitaInversa ? "bg-slate-900 text-white" : "bg-white hover:bg-slate-50"}`}
              >
                Da RAL
              </button>
              <button
                type="button" onClick={() => setModalitaInversa(true)}
                className={`px-3 border-l border-slate-300 ${modalitaInversa ? "bg-slate-900 text-white" : "bg-white hover:bg-slate-50"}`}
              >
                Da netto mensile
              </button>
            </div>
          </Campo>

          {!modalitaInversa ? (
            <CampoImporto
              label="RAL annua (€)" testo={ralTesto} valore={ral}
              onTesto={setRalTesto} passo={500}
              min={limiti.ral.min} max={limiti.ral.max}
            />
          ) : (
            <CampoImporto
              label="Netto mensile desiderato (€)" testo={nettoTargetTesto} valore={nettoTarget}
              onTesto={setNettoTargetTesto} passo={50}
              min={limiti.netto.min} max={limiti.netto.max}
            />
          )}

          <Campo label="Mensilità">
            <select
              value={mensilita} onChange={(e) => setMensilita(Number(e.target.value))}
              className="h-10 px-3 border border-slate-300 rounded-md text-sm bg-white"
            >
              <option value={12}>12</option>
              <option value={13}>13</option>
              <option value={14}>14</option>
            </select>
          </Campo>

          <Campo label="Visualizzazione">
            <label className="flex h-10 items-center gap-2 text-sm whitespace-nowrap">
              <input
                type="checkbox" checked={mostraCostoAzienda}
                onChange={(e) => setMostraCostoAzienda(e.target.checked)}
                className="rounded border-slate-300"
              />
              Mostra costo azienda
            </label>
          </Campo>
        </div>

        {(sottoIlMinimo || sopraIlMassimo) && (
          <div className="mt-4 p-3 bg-amber-50 border border-amber-300 rounded text-xs">
            <div className="font-semibold text-amber-900">
              Valore fuori dall'intervallo in cui il modello è attendibile
            </div>
            <p className="mt-1 text-slate-700">
              {sottoIlMinimo ? limiti.ral.motivoMinimo : limiti.ral.motivoMassimo}
            </p>

              Fonte della soglia: {sottoIlMinimo ? limiti.ral.fonteMinimo : limiti.ral.fonteMassimo}.

            </p>
          </div>
        )}

          <div className="mt-4 p-3 bg-slate-50 border border-slate-200 rounded text-sm">
            {inversa && inversa.trovata ? (

                <div>
                  <div className="text-xs text-slate-500">RAL necessaria</div>
                  <div className="text-lg font-bold tabular-nums">{fmt(inversa.ral)}</div>
                </div>

                  <div className="text-xs text-slate-500">Costo azienda</div>
                  <div className="text-lg font-bold tabular-nums">{fmt(result.costoAzienda.costoTotale)}</div>
                </div>
                <div>
                  <div className="text-xs text-slate-500">Netto mensile ottenuto</div>
                  <div className="text-lg font-bold tabular-nums">{fmt(result.nettoMensile)}</div>
                </div>

            )}

        )}

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <KPI accent label="Netto annuo" value={fmt0(result.nettoAnnuo)} sub={`su RAL ${fmt0(result.input.ral)}`} />

        <KPI label="Aliquota media effettiva" value={pct(result.aliquotaMediaEffettiva, 1)} sub={`cuneo sul costo azienda ${pct(result.cuneoFiscale, 1)}`} />

      {/* GRAFICO */}
      <Card title="Aliquota marginale effettiva al variare della RAL (0 – 100.000 €)">
        <GraficoMarginale config={config} />
      </Card>

      {/* VALIDAZIONE */}
      <Card title="Tabella di validazione — da confrontare con calcolatori ufficiali">
        <TabellaValidazione config={config} mensilita={mensilita} />
      </Card>

      {/* ASSUNZIONI E LIMITI */}
      <Card title="Assunzioni del modello">
        <ul className="text-xs space-y-2 text-slate-700 sm:columns-2 sm:gap-8">
          {ASSUNZIONI.map((a, i) => (
            <li key={i} className="flex gap-2 break-inside-avoid mb-2">
              <span className="text-slate-400">•</span><span>{a}</span>
            </li>
          ))}
        </ul>
      </Card>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
